<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D~hairs | Premium Flyer</title>
    <style>
        /* ── reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5e6ec;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 20px;
        }

        /* ── flyer card ── */
        .flyer {
            position: relative;
            width: 100%;
            max-width: 520px;
            aspect-ratio: 0.8 / 1;
            background: linear-gradient(145deg, #fce4ec, #f8d7e0);
            border-radius: 40px;
            overflow: hidden;
            box-shadow:
                0 30px 60px rgba(180, 80, 120, 0.25),
                0 10px 30px rgba(180, 80, 120, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
        }

        .flyer:hover {
            transform: scale(1.01);
        }

        /* ── decorative SVG layers ── */
        .flyer-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ── content (above SVG) ── */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        /* ── top section ── */
        .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .badge {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #a05a7a;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            font-weight: 400;
        }

        .year {
            font-size: 12px;
            color: #a05a7a;
            letter-spacing: 2px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            padding: 4px 14px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* ── main heading ── */
        .main-heading {
            margin-top: 16px;
        }

        .brand {
            font-size: 52px;
            font-weight: 700;
            color: #4a1e30;
            letter-spacing: -1px;
            line-height: 0.9;
            font-family: 'Georgia', 'Times New Roman', serif;
            text-shadow: 0 2px 8px rgba(180, 80, 120, 0.15);
        }

        .brand span {
            color: #b05a7a;
            font-style: italic;
            font-weight: 300;
        }

        .tagline {
            font-size: 14px;
            color: #7a4a62;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 8px;
            font-weight: 300;
            border-top: 1px solid rgba(160, 90, 122, 0.25);
            padding-top: 10px;
            max-width: 70%;
        }

        /* ── middle description ── */
        .description {
            margin: 20px 0 10px;
        }

        .description p {
            font-size: 15px;
            line-height: 1.7;
            color: #4a2a3a;
            font-weight: 300;
            letter-spacing: 0.3px;
            max-width: 85%;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .description p:last-child {
            font-style: italic;
            color: #a05a7a;
            font-size: 16px;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        /* ── product icons row ── */
        .products {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin: 12px 0 6px;
        }

        .product-pill {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            padding: 6px 18px;
            border-radius: 100px;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #5a2a42;
            font-weight: 400;
            transition: all 0.2s;
        }

        .product-pill:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }

        /* ── bottom section ── */
        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 10px;
            border-top: 1px solid rgba(160, 90, 122, 0.2);
            padding-top: 18px;
        }

        .cta {
            display: flex;
            flex-direction: column;
        }

        .cta .label {
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #a05a7a;
            font-weight: 300;
        }

        .cta .number {
            font-size: 22px;
            font-weight: 600;
            color: #3a1a2a;
            letter-spacing: 1px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .cta .number small {
            font-size: 13px;
            font-weight: 300;
            color: #a05a7a;
            margin-left: 6px;
        }

        .social {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .social span {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #a05a7a;
            font-weight: 300;
        }

        .social .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #b05a7a;
            opacity: 0.5;
        }

        /* ── responsive ── */
        @media (max-width: 480px) {
            .flyer {
                padding: 28px 20px;
                border-radius: 28px;
            }

            .brand {
                font-size: 38px;
            }

            .tagline {
                font-size: 11px;
                letter-spacing: 3px;
                max-width: 80%;
            }

            .description p {
                font-size: 13px;
                max-width: 100%;
            }

            .product-pill {
                font-size: 9px;
                padding: 4px 12px;
            }

            .cta .number {
                font-size: 18px;
            }

            .badge,
            .year {
                font-size: 9px;
                padding: 4px 12px;
            }

            .bottom {
                flex-wrap: wrap;
                gap: 12px;
            }
        }

        @media (max-width: 380px) {
            .brand {
                font-size: 30px;
            }
            .products {
                gap: 8px;
            }
            .product-pill {
                font-size: 8px;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="flyer">

        <!-- ─── SVG DECORATIVE LAYER ─── -->
        <svg class="flyer-svg" viewBox="0 0 520 650" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
            <!-- large soft circles -->
            <circle cx="420" cy="80" r="180" fill="rgba(200,130,160,0.12)" />
            <circle cx="80" cy="500" r="200" fill="rgba(200,130,160,0.08)" />
            <circle cx="460" cy="580" r="120" fill="rgba(180,110,150,0.07)" />

            <!-- elegant swoosh / ribbon -->
            <path d="M -20 200 Q 120 120 260 200 Q 400 280 540 200" stroke="rgba(160,90,122,0.15)" stroke-width="1.5" fill="none" />
            <path d="M -20 220 Q 120 140 260 220 Q 400 300 540 220" stroke="rgba(160,90,122,0.08)" stroke-width="1" fill="none" />

            <!-- small diamond accents -->
            <polygon points="460,40 470,55 460,70 450,55" fill="rgba(180,110,150,0.15)" />
            <polygon points="60,610 68,622 60,634 52,622" fill="rgba(180,110,150,0.12)" />

            <!-- subtle dots -->
            <circle cx="480" cy="160" r="3" fill="rgba(180,110,150,0.10)" />
            <circle cx="500" cy="140" r="2" fill="rgba(180,110,150,0.08)" />
            <circle cx="30" cy="380" r="4" fill="rgba(180,110,150,0.07)" />
            <circle cx="490" cy="410" r="2.5" fill="rgba(180,110,150,0.06)" />

            <!-- hair-like abstract strokes -->
            <path d="M 380 320 Q 420 300 440 340 Q 460 380 430 400" stroke="rgba(160,90,122,0.06)" stroke-width="2" fill="none" />
            <path d="M 400 300 Q 440 280 460 320 Q 480 360 450 380" stroke="rgba(160,90,122,0.04)" stroke-width="2" fill="none" />

            <!-- border glow -->
            <rect x="12" y="12" width="496" height="626" rx="30" stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none" />
        </svg>

        <!-- ─── CONTENT ─── -->
        <div class="content">

            <!-- top -->
            <div class="top">
                <span class="badge">✦ premium</span>
                <span class="year">2026</span>
            </div>

            <!-- heading -->
            <div class="main-heading">
                <div class="brand">
                    D~<span>hairs</span>
                </div>
                <div class="tagline">luxury hair collective</div>
            </div>

            <!-- description -->
            <div class="description">
                <p>
                    Sales of all kind of human hair, raw hairs, virgin hairs,
                    wig tools, and hair maintenance kits.
                </p>
                <p>— giving you nothing but the best</p>
            </div>

            <!-- product pills -->
            <div class="products">
                <span class="product-pill">Human Hair</span>
                <span class="product-pill">Raw Hairs</span>
                <span class="product-pill">Virgin Hairs</span>
                <span class="product-pill">Wig Tools</span>
                <span class="product-pill">Maintenance Kits</span>
            </div>

            <!-- bottom -->
            <div class="bottom">
                <div class="cta">
                    <span class="label">connect</span>
                    <span class="number">
                        @d.hairs
                        <small>✦</small>
                    </span>
                </div>
                <div class="social">
                    <span>shop</span>
                    <span class="dot"></span>
                    <span>book</span>
                    <span class="dot"></span>
                    <span>care</span>
                </div>
            </div>

        </div>
        <!-- /content -->

    </div>
    <!-- /flyer -->

</body>
</html>
